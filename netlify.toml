# Netlify-Konfiguration für die Kfz-Krautschick-Seite.
# Das Next.js-Projekt liegt in der Wurzel dieses Repos — kein base nötig.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 verlangt Node 20 oder neuer; 22 ist Netlifys aktuelle LTS.
  NODE_VERSION = "22"

# Das offizielle Next.js-Plugin übernimmt Routing, Bildoptimierung und Caching.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sicherheits-Header. Die Seite lädt außer der OpenStreetMap-Karte nichts von
# fremden Domains, daher kann die Policy eng bleiben.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
